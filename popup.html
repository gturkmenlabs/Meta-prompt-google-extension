<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetaPrompt</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body class="popup-page">
  <div class="mp-popup" >

    <!-- ——— Header ——— -->
    <div class="mp-pop-head">
      <div class="mp-brand">
        <span class="mp-logo">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
            <path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"
              stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </span>
        <div class="mp-brand-text">
          <span class="mp-word">MetaPrompt</span>
          <span class="mp-sub">prompt engine</span>
        </div>
        <span class="mp-ver">v2.5</span>
      </div>
      <button class="mp-icon-btn" id="settingsLink" title="Settings" aria-label="Open settings">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none">
          <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9 5.3 5.3"
            stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- ——— Body ——— -->
    <div class="mp-pop-body">
      <div class="mp-view">
        <div class="intro"><span class="eyebrow">FROM IDEA TO INSTRUCTION</span>
          <h1>A clearer prompt.<br>A better starting point.</h1>
          <p>Turn a rough idea into a prompt ready to use.</p>
        </div>

        <!-- Source text -->
        <div class="mp-row-between">
          <label class="mp-label" for="rawInput">Your starting point</label>
          <span class="mp-pill" id="fromPagePill" style="display:none">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M9 4.5a1.6 1.6 0 0 1 3.2 0c0 .5.4.9.9.9h2.1a1 1 0 0 1 1 1v2.1c0 .5.4.9.9.9a1.6 1.6 0 0 1 0 3.2c-.5 0-.9.4-.9.9v2.6a1 1 0 0 1-1 1h-2.6c-.5 0-.9-.4-.9-.9a1.6 1.6 0 0 0-3.2 0c0 .5-.4.9-.9.9H6.5a1 1 0 0 1-1-1v-2.6c0-.5-.4-.9-.9-.9a1.6 1.6 0 0 1 0-3.2c.5 0 .9-.4.9-.9V6.4a1 1 0 0 1 1-1h1.6c.5 0 .9-.4.9-.9Z"
                stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            from page
          </span>
        </div>
        <textarea class="mp-source" id="rawInput" spellcheck="false"
          placeholder="What would you like to create, explore, or solve?"></textarea>

        <!-- Controls: language + length -->
        <div class="mp-controls">
          <div class="mp-ctrl">
            <label class="mp-label tiny" for="langSelect">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="8.4" stroke="currentColor" stroke-width="1.5"/>
                <path d="M3.6 12h16.8M12 3.6c2.4 2.3 2.4 14.5 0 16.8M12 3.6c-2.4 2.3-2.4 14.5 0 16.8"
                  stroke="currentColor" stroke-width="1.5"/>
              </svg>
              Output
            </label>
            <div class="mp-select-wrap">
              <select class="mp-select" id="langSelect">
                <option value="auto">Automatic</option>
                <option value="tr">Turkish</option>
                <option value="en">English</option>
              </select>
              <span class="mp-select-chev">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none">
                  <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </div>
            <div class="mp-mode-desc" id="langDesc"></div>
          </div>

          <div class="mp-ctrl">
            <span class="mp-label tiny">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M13 2 4.5 13.5H11l-1 8.5L19.5 10H13l0-8Z"
                  stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              </svg>
              Length
            </span>
            <div class="mp-seg small" id="lenSeg">
              <button class="mp-seg-btn" data-val="kisa">Short</button>
              <button class="mp-seg-btn on" data-val="orta">Medium</button>
              <button class="mp-seg-btn" data-val="uzun">Long</button>
              <button class="mp-seg-btn" data-val="maks">Max</button>
            </div>
            <!-- hidden select synced by popup.js -->
            <select id="lenSelect" style="display:none">
              <option value="kisa">Short</option>
              <option value="orta" selected>Medium</option>
              <option value="uzun">Long</option>
              <option value="maks">Max</option>
            </select>
            <div class="mp-mode-desc" id="lenDesc"></div>
          </div>
        </div>

        <!-- Mode selection (Standard vs Vibe Coding) -->
        <div class="mp-controls" style="margin-top: 10px;">
          <div class="mp-ctrl" style="grid-column: span 2;">
            <span class="mp-label tiny">
              <svg viewBox="0 0 24 24" fill="none" style="width:12px; height:12px;">
                <path d="M3.75 13.5l10.5-11.25L12.75 9h7.5L9.75 20.25 11.25 15h-7.5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Choose your approach
            </span>
            <div class="mp-seg small" id="modeSeg">
              <button class="mp-seg-btn on" data-val="standard"><span class="mode-icon" aria-hidden="true">✳</span><span>Standard<small>Everyday ideas &amp; tasks</small></span></button>
              <button class="mp-seg-btn" data-val="vibecoding"><span class="mode-icon" aria-hidden="true">⌘</span><span>Vibe Coding<small>Build &amp; improve code</small></span></button>
              <button class="mp-seg-btn" data-val="research"><span class="mode-icon" aria-hidden="true">◎</span><span>Web Research<small>Explore &amp; find sources</small></span></button>
              <button class="mp-seg-btn" data-val="antihallu"><span class="mode-icon" aria-hidden="true">◇</span><span>Accuracy<small>Verify &amp; cross-check</small></span></button>
            </div>
            <select id="modeSelect" style="display:none">
              <option value="standard" selected>Standard</option>
              <option value="vibecoding">Vibe Coding</option>
              <option value="research">Web Research</option>
              <option value="antihallu">Anti-Hallucination</option>
            </select>
            <div class="mp-mode-desc" id="modeDesc"></div>
          </div>
        </div>

        <!-- Vibe Strategy selection (Visible only when Vibe Coding is selected) -->
        <div class="mp-controls" id="vibeStrategyControls" style="display: none; margin-top: 10px;">
          <div class="mp-ctrl" style="grid-column: span 2;">
            <span class="mp-label tiny">
              <svg viewBox="0 0 24 24" fill="none" style="width:12px; height:12px;">
                <path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              Vibe Strategy
            </span>
            <div class="mp-select-wrap">
              <select class="mp-select" id="vibeStrategySelect">
                <option value="auto" selected>Auto (Select by Intent)</option>
                <option value="standard">Standard Vibe (Hybrid Engineering)</option>
                <option value="jazz">Jazz Improvisation</option>
                <option value="fractal">Fractal Growth Architecture</option>
                <option value="emotive">Emotive Sandbox</option>
                <option value="hydrological">Hydrological Flow</option>
                <option value="alchemical">Alchemical Refiner</option>
              </select>
              <span class="mp-select-chev">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none">
                  <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </div>
            <div class="mp-mode-desc" id="vibeStrategyDesc"></div>
          </div>
        </div>

        <!-- Research strategy selection (Visible only when Web Research is selected) -->
        <div class="mp-controls" id="researchStrategyControls" style="display: none; margin-top: 10px;">
          <div class="mp-ctrl" style="grid-column: span 2;">
            <span class="mp-label tiny">
              <svg viewBox="0 0 24 24" fill="none" style="width:12px; height:12px;">
                <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/>
                <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
              Research Strategy
            </span>
            <div class="mp-select-wrap">
              <select class="mp-select" id="researchStrategySelect">
                <option value="auto" selected>Auto (Select by Intent)</option>
                <option value="comprehensive">Comprehensive (All Techniques)</option>
                <option value="web">Web Search (Boolean + Dorking)</option>
                <option value="academic">Academic (Scholar + Citations)</option>
                <option value="osint">OSINT (Google Dorking Focused)</option>
                <option value="paywall">Paywall Bypass (Legal Means)</option>
                <option value="literature">Systematic Literature Review</option>
              </select>
              <span class="mp-select-chev">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none">
                  <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </div>
            <div class="mp-mode-desc" id="researchStrategyDesc"></div>
          </div>
        </div>

        <!-- Anti-Hallucination strategy selection (Visible only when Anti-Hallucination is selected) -->
        <div class="mp-controls" id="antihalluStrategyControls" style="display: none; margin-top: 10px;">
          <div class="mp-ctrl" style="grid-column: span 2;">
            <span class="mp-label tiny">
              <svg viewBox="0 0 24 24" fill="none" style="width:12px; height:12px;">
                <path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 14.4l-4.8 2.5.9-5.4L4.2 7.7l5.4-.8L12 2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
              </svg>
              Anti-Hallucination Technique
            </span>
            <div class="mp-select-wrap">
              <select class="mp-select" id="antihalluStrategySelect">
                <option value="auto" selected>Auto (Select by Intent)</option>
                <option value="ensemble">All (Ensemble — RAG+ReAct+CoN+CoVe)</option>
                <option value="rag">RAG (Retrieval Augmented Generation)</option>
                <option value="react">ReAct (Reasoning + Acting + Tool Use)</option>
                <option value="con">Chain-of-Note (Source Filtering)</option>
                <option value="cok">Chain-of-Knowledge (Dynamic Evidence)</option>
                <option value="logicot">LogiCoT (Symbolic Logic Verification)</option>
                <option value="cove">Chain-of-Verification (Self-Verify)</option>
                <option value="atomic">Atomic Claim Verification (FActScore + RARR)</option>
                <option value="selfcheck">Self-Consistency Check (SelfCheck + CAD)</option>
                <option value="triangulate">Semantic Triangulation (Code Verification)</option>
              </select>
              <span class="mp-select-chev">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none">
                  <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </div>
            <div class="mp-mode-desc" id="antihalluStrategyDesc"></div>
          </div>
        </div>

        <!-- HDA: bes fazli Kartezyen-Hilomorfik dusunme algoritmasi (varsayilan: faz ajanlari) -->
        <div class="mp-ctrl" id="hdaRow" style="margin-top:10px;">
          <label class="mp-label tiny" for="hdaModeSelect">HDA thinking algorithm</label>
          <div class="mp-select-wrap">
            <select class="mp-select" id="hdaModeSelect">
              <option value="agents" selected>Phase agents (5 extra calls, deepest)</option>
              <option value="inline">Inline audit (no extra calls)</option>
              <option value="off">Off</option>
            </select>
            <span class="mp-select-chev">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none">
                <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- Capraz-model konsensus denetimi (istege bagli, ekstra API cagrisi) -->
        <label class="mp-label tiny" id="consensusRow" style="display:flex; align-items:center; gap:6px; margin-top:10px; cursor:pointer;">
          <input type="checkbox" id="consensusCheckToggle" style="margin:0;">
          <span><strong>Get a second opinion</strong><small>Another model reviews the result. Extra API cost.</small></span>
        </label>

        <!-- Revise button -->
        <button class="mp-btn accent full revise" id="revizeEtBtn">
          <svg class="btn-spark" viewBox="0 0 24 24" width="15" height="15" fill="none">
            <path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"
              stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span class="btn-label">Create expert prompt</span>
          <span class="mp-spin btn-spin"></span>
          <span class="btn-step"></span>
          <span class="mp-progress" id="reviseProgress" style="width:0%"></span>
        </button>

        <!-- Status messages -->
        <div id="status" role="status" aria-live="polite" class="mp-status"></div>

        <!-- Done bar (visible after successful revision) -->
        <div class="mp-done-bar" id="doneBar" style="display:none">
          <span class="mp-done-dot"></span>
          <span id="doneMsg">Done</span>
          <button class="mp-ghost-mini" id="redoBtn">Redo</button>
        </div>

        <!-- Result section (visible after successful revision) -->
        <div id="resultSection" style="display:none">
          <div class="mp-tabs">
            <span class="mp-tab on">YOUR REVISED PROMPT</span>
          </div>
          <div class="mp-tabpane">
            <textarea id="output" aria-label="Revised prompt" readonly spellcheck="false"
              placeholder="The revised expert prompt will appear here…"></textarea>
          </div>
          <div class="mp-actions">
            <button class="mp-btn ghost" id="copyBtn">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none">
                <rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.6"/>
                <path d="M5 15.5A2 2 0 0 1 4 14V6a2 2 0 0 1 2-2h8a2 2 0 0 1 1.5.7"
                  stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
              <span class="copy-label">Copy</span>
            </button>
            <button class="mp-btn accent" id="writePageBtn">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none">
                <path d="M4 20h16M5 16.5 15.6 5.9a2 2 0 0 1 2.8 0l-.3-.3a2 2 0 0 1 0 2.8L7.5 19 4 20l1-3.5Z"
                  stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              </svg>
              <span class="write-label">Write to Page</span>
            </button>
          </div>
        </div>

        <!-- Recent revisions (collapsible) -->
        <div class="mp-recent" id="historyRow" style="display:none">
          <button class="mp-recent-head" id="recentHead">
            <svg viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M12 7.5V12l3 1.8" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Recent Revisions
            <span class="mp-recent-n" id="histCount">0</span>
            <span class="mp-recent-chev" id="histChev">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none">
                <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.7"
                  stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </button>
          <ul class="mp-recent-list" id="historyList" style="display:none"></ul>
          <button class="mp-recent-clear" id="histClearBtn" style="display:none">Clear all history</button>
          <!-- hidden select kept for storage compat -->
          <select id="historySelect" style="display:none"></select>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
