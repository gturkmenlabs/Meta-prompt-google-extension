<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetaPrompt — Settings</title>
  <link rel="stylesheet" href="options.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body class="settings-page">
  <div class="mp-settings">

    <!-- Header -->
    <div class="ms-head">
      <span class="ms-logo">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
          <path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"
            stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </span>
      <div>
        <div class="ms-title">MetaPrompt</div>
        <div class="ms-sub">Settings</div>
      </div>
    </div>

    <!-- Body -->
    <div class="ms-body">
      <div class="intro"><span class="eyebrow">MAKE IT YOURS</span>
        <h1>Your models.<br>Your way of working.</h1>
        <p>Connect a provider and choose the model behind your prompts.</p>
      </div>

      <!-- Connection hero -->
      <div class="ms-hero">
        <div class="ms-hero-ic">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="8" cy="8" r="4.2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M11 11l8 8M16 16l2-2M18.5 18.5l1.5-1.5"
              stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <div class="ms-hero-t">A direct connection</div>
          <div class="ms-hero-s">Your key stays in this browser and is used to authenticate with your API provider.</div>
        </div>
      </div>

      <!-- Provider -->
      <div class="ms-field">
        <label class="ms-label">Provider</label>
        <!-- Visual segmented buttons (synced with hidden select by options.js) -->
        <div class="ms-seg" id="providerSeg">
          <button class="ms-seg-btn on" data-provider="anthropic">Anthropic</button>
          <button class="ms-seg-btn" data-provider="openrouter">OpenRouter</button>
        </div>
        <!-- Hidden select that options.js reads/writes -->
        <select id="provider" style="display:none">
          <option value="anthropic">Anthropic</option>
          <option value="openrouter">OpenRouter</option>
        </select>
      </div>

      <!-- API key -->
      <div class="ms-field">
        <label class="ms-label" for="apiKey">API Key</label>
        <div class="ms-input-wrap">
          <input class="ms-input mono" id="apiKey" type="password"
            placeholder="sk-ant-api03-…" autocomplete="off" spellcheck="false">
          <button class="ms-show-btn" id="showKeyBtn" type="button">Show</button>
        </div>
        <div class="ms-hint" style="color:var(--faint); font-size:11px; margin-top:2px;">
          Stored as plain text — be careful on shared computers.
        </div>
      </div>

      <!-- Model -->
      <div class="ms-field">
        <label class="ms-label" for="model">Model</label>
        <div class="ms-input-wrap" style="padding-right:0">
          <input class="ms-input" id="model" list="modelList"
            placeholder="model ID" autocomplete="off" spellcheck="false"
            style="padding-right:12px">
          <datalist id="modelList"></datalist>
        </div>
        <div class="ms-hint" id="modelHint"></div>

        <!-- OpenRouter extras (shown/hidden by options.js) -->
        <select id="tierSelect" aria-label="Model pricing tier">
          <option value="free">Free models</option>
          <option value="paid">Paid models</option>
          <option value="all">All models</option>
        </select>
        <button id="loadFreeBtn" type="button">⬇ Load OpenRouter models</button>
        <button id="verifyBtn" type="button">✓ Test and add working ones</button>
        <select id="modelSelect" aria-label="Available models">
          <option value="">— Select from free models —</option>
        </select>
        <div class="ms-hint" id="freeHint"></div>
      </div>

      <div class="ms-div"></div>

      <!-- Test connection -->
      <div class="ms-field">
        <button class="ms-btn ghost" id="testBtn" type="button">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none">
            <path d="M5 12h13M12 6l6 6-6 6" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Test Connection
        </button>
        <div class="ms-hint" id="testResult" role="status" aria-live="polite"></div>
      </div>

      <!-- Save -->
      <div class="ms-field">
        <button class="ms-btn accent" id="saveBtn" type="button">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none">
            <path d="M5 12.5l4.2 4.3L19 7" stroke="currentColor" stroke-width="1.9"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Save settings
        </button>
        <div id="saved" role="status" aria-live="polite"></div>
      </div>

    </div>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
