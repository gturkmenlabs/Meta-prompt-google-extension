<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #0F1012; }
    body { width: 480px; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }

    .mp-settings {
      --s0: #121317; --s1: #191B20; --s2: #22252B;
      --bd: rgba(255,255,255,0.08);
      --tx: #ECEDEE; --dim: #9BA1A8; --faint: #6B7077;
      --add: #5FE0A0; --del: #FF8A92;
      --accent: #FF7A4D;
      --accent-soft: color-mix(in srgb, var(--accent) 16%, transparent);
      background: linear-gradient(180deg, #15161A, #111216 200px);
      color: var(--tx);
      min-height: 100vh;
    }

    /* ——— Header ——— */
    .ms-head {
      display: flex; align-items: center; gap: 10px;
      padding: 16px 20px; border-bottom: 1px solid var(--bd);
      background: rgba(255,255,255,0.015);
    }
    .ms-logo {
      width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #C0392B));
      color: #15110E;
      box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 28%, transparent);
    }
    .ms-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
    }
    .ms-sub {
      font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--faint); margin-top: 2px;
    }

    /* ——— Body ——— */
    .ms-body { padding: 20px; display: flex; flex-direction: column; gap: 0; }

    /* ——— Hero card ——— */
    .ms-hero {
      display: flex; gap: 11px; align-items: flex-start;
      background: var(--s1); border: 1px solid var(--bd);
      border-radius: 12px; padding: 12px; margin-bottom: 20px;
    }
    .ms-hero-ic {
      flex-shrink: 0; width: 32px; height: 32px; border-radius: 9px;
      background: var(--accent-soft); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
    }
    .ms-hero-ic svg { width: 16px; height: 16px; display: block; }
    .ms-hero-t { font-size: 13px; font-weight: 600; }
    .ms-hero-s { font-size: 11px; color: var(--dim); line-height: 1.45; margin-top: 3px; }

    /* ——— Field groups ——— */
    .ms-field { margin-bottom: 18px; display: flex; flex-direction: column; gap: 7px; }
    .ms-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.09em; color: var(--faint);
    }

    /* Segmented provider control */
    .ms-seg {
      display: flex; gap: 3px; background: var(--s1); border: 1px solid var(--bd);
      border-radius: 10px; padding: 3px;
    }
    .ms-seg-btn {
      flex: 1; border: none; background: transparent; color: var(--dim);
      border-radius: 7px; padding: 9px 0; font-size: 12.5px; cursor: pointer;
      transition: all .15s; font-family: inherit; font-weight: 500;
    }
    .ms-seg-btn:hover { color: var(--tx); }
    .ms-seg-btn.on {
      background: var(--accent-soft); color: var(--accent); font-weight: 600;
    }

    /* Input */
    .ms-input-wrap { position: relative; display: flex; align-items: center; }
    .ms-input {
      width: 100%; background: var(--s1); border: 1px solid var(--bd);
      border-radius: 10px; padding: 10px 56px 10px 12px;
      color: var(--tx); font-size: 12.5px; outline: none; transition: border-color .15s;
      font-family: inherit;
    }
    .ms-input.mono {
      font-family: "JetBrains Mono", monospace; font-size: 11.5px; letter-spacing: -0.02em;
    }
    .ms-input:focus { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
    .ms-input::placeholder { color: var(--faint); }
    .ms-show-btn {
      position: absolute; right: 10px; background: none; border: none;
      color: var(--accent); font-size: 11.5px; cursor: pointer; font-family: inherit;
      padding: 0;
    }

    /* Select */
    .ms-select-wrap { position: relative; }
    .ms-select {
      width: 100%; appearance: none; -webkit-appearance: none;
      background: var(--s1); border: 1px solid var(--bd); border-radius: 10px;
      padding: 10px 30px 10px 12px; color: var(--tx); font-size: 12.5px;
      cursor: pointer; outline: none; font-family: inherit;
    }
    .ms-select:focus { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
    .ms-select-chev {
      position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
      color: var(--dim); pointer-events: none; display: flex;
    }

    /* Hint text */
    .ms-hint {
      font-size: 11px; color: var(--dim);
      display: flex; align-items: center; gap: 6px; line-height: 1.4;
    }
    .ms-hint svg { width: 13px; height: 13px; flex-shrink: 0; display: block; }
    .ms-hint.ok { color: var(--add); }
    .ms-hint.err { color: var(--del); }

    /* OpenRouter-only fields (shown/hidden by JS) */
    #tierSelect, #loadFreeBtn, #verifyBtn, #modelSelect {
      display: none;
    }
    #tierSelect {
      width: 100%; appearance: none; -webkit-appearance: none;
      background: var(--s1); border: 1px solid var(--bd); border-radius: 10px;
      padding: 10px 12px; color: var(--tx); font-size: 12.5px;
      cursor: pointer; outline: none; font-family: inherit;
    }
    #modelSelect {
      width: 100%; appearance: none; -webkit-appearance: none;
      background: var(--s1); border: 1px solid var(--bd); border-radius: 10px;
      padding: 10px 12px; color: var(--tx); font-size: 12.5px;
      cursor: pointer; outline: none; font-family: inherit; margin-top: 4px;
    }

    /* Divider */
    .ms-div {
      height: 1px; background: var(--bd); margin: 4px 0 20px;
    }

    /* Buttons */
    .ms-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; border: none; cursor: pointer;
      font: 600 13px/1 ui-sans-serif, system-ui, sans-serif;
      border-radius: 11px; padding: 11px 14px; transition: all .15s;
      font-family: inherit;
    }
    .ms-btn.accent {
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 96%, #fff), var(--accent));
      color: #16110D;
    }
    .ms-btn.accent:hover { filter: brightness(1.06); }
    .ms-btn.ghost { background: var(--s1); color: var(--tx); border: 1px solid var(--bd); }
    .ms-btn.ghost:hover { background: var(--s2); }
    .ms-btn:disabled { cursor: default; opacity: 0.6; }
    .ms-btn + .ms-btn { margin-top: 8px; }

    #loadFreeBtn, #verifyBtn {
      width: 100%; border: none; cursor: pointer;
      font: 600 13px/1 ui-sans-serif, system-ui, sans-serif;
      border-radius: 11px; padding: 10px 14px; transition: all .15s;
      font-family: inherit; margin-top: 8px;
    }
    #loadFreeBtn {
      background: var(--s1); color: var(--tx); border: 1px solid var(--bd);
    }
    #loadFreeBtn:hover { background: var(--s2); }
    #loadFreeBtn:disabled { opacity: 0.6; cursor: default; }
    #verifyBtn {
      background: var(--s1); color: var(--add); border: 1px solid rgba(95,224,160,0.2);
    }
    #verifyBtn:hover { background: rgba(95,224,160,0.06); }
    #verifyBtn:disabled { opacity: 0.6; cursor: default; }

    /* Test result + saved feedback */
    #testResult, #freeHint {
      font-size: 11.5px; min-height: 0; line-height: 1.4;
    }
    #saved {
      font-size: 12px; min-height: 0; line-height: 1.4; margin-top: 6px;
    }

    /* Model input datalist (no custom styling possible, just inherit) */
    #model { font-family: "JetBrains Mono", monospace; font-size: 11.5px; letter-spacing: -0.02em; }
  </style>
</head>
<body>
  <div class="mp-settings">

    <!-- Header -->
    <div class="ms-head">
      <span class="ms-logo">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
          <path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"
            stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </span>
      <div>
        <div class="ms-title">MetaPrompt</div>
        <div class="ms-sub">Ayarlar</div>
      </div>
    </div>

    <!-- Body -->
    <div class="ms-body">

      <!-- Connection hero -->
      <div class="ms-hero">
        <div class="ms-hero-ic">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="8" cy="8" r="4.2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M11 11l8 8M16 16l2-2M18.5 18.5l1.5-1.5"
              stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <div class="ms-hero-t">Bağlantı</div>
          <div class="ms-hero-s">Anahtarlar yalnızca bu tarayıcıda (chrome.storage.local) saklanır — sunucularımıza gönderilmez.</div>
        </div>
      </div>

      <!-- Provider -->
      <div class="ms-field">
        <label class="ms-label">Sağlayıcı</label>
        <!-- Visual segmented buttons (synced with hidden select by options.js) -->
        <div class="ms-seg" id="providerSeg">
          <button class="ms-seg-btn on" data-provider="anthropic">Anthropic</button>
          <button class="ms-seg-btn" data-provider="openrouter">OpenRouter</button>
        </div>
        <!-- Hidden select that options.js reads/writes -->
        <select id="provider" style="display:none">
          <option value="anthropic">Anthropic</option>
          <option value="openrouter">OpenRouter</option>
        </select>
      </div>

      <!-- API key -->
      <div class="ms-field">
        <label class="ms-label" for="apiKey">API Anahtarı</label>
        <div class="ms-input-wrap">
          <input class="ms-input mono" id="apiKey" type="password"
            placeholder="sk-ant-api03-…" autocomplete="off" spellcheck="false">
          <button class="ms-show-btn" id="showKeyBtn" type="button">Göster</button>
        </div>
        <div class="ms-hint" style="color:var(--faint); font-size:11px; margin-top:2px;">
          Düz metin olarak saklanır — paylaşılan bilgisayarlarda dikkatli olun.
        </div>
      </div>

      <!-- Model -->
      <div class="ms-field">
        <label class="ms-label" for="model">Model</label>
        <div class="ms-input-wrap" style="padding-right:0">
          <input class="ms-input" id="model" list="modelList"
            placeholder="model kimliği" autocomplete="off" spellcheck="false"
            style="padding-right:12px">
          <datalist id="modelList"></datalist>
        </div>
        <div class="ms-hint" id="modelHint"></div>

        <!-- OpenRouter extras (shown/hidden by options.js) -->
        <select id="tierSelect">
          <option value="free">Ücretsiz modeller</option>
          <option value="paid">Ücretli modeller</option>
          <option value="all">Tüm modeller</option>
        </select>
        <button id="loadFreeBtn" type="button">⬇ OpenRouter modellerini yükle</button>
        <button id="verifyBtn" type="button">✓ Çalışanları test et ve ekle</button>
        <select id="modelSelect">
          <option value="">— Ücretsiz modellerden seç —</option>
        </select>
        <div class="ms-hint" id="freeHint"></div>
      </div>

      <div class="ms-div"></div>

      <!-- Test connection -->
      <div class="ms-field">
        <button class="ms-btn ghost" id="testBtn" type="button">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none">
            <path d="M5 12h13M12 6l6 6-6 6" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Bağlantıyı Test Et
        </button>
        <div class="ms-hint" id="testResult"></div>
      </div>

      <!-- Save -->
      <div class="ms-field">
        <button class="ms-btn accent" id="saveBtn" type="button">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none">
            <path d="M5 12.5l4.2 4.3L19 7" stroke="currentColor" stroke-width="1.9"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Kaydet
        </button>
        <div id="saved"></div>
      </div>

    </div>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
